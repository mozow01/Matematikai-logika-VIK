<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boole, Ite és prg – interaktív Coq-ablak</title>
  <style>
    html, body, #ide-wrapper { height: 100%; margin: 0; }
    #document { padding: 0.75rem 1rem 2rem; }
    #document h1 { font: 600 1.15rem/1.4 system-ui, sans-serif; }
    #document p { font: 0.95rem/1.5 system-ui, sans-serif; }
    [hidden] { display: none !important; }
    #launcher {
      box-sizing: border-box;
      min-height: 158px;
      display: grid;
      place-items: center;
      padding: 1rem;
      color: #163c36;
      background: linear-gradient(135deg, #f4fbfa, #dff3ef);
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    #launcher strong { display: block; margin-bottom: 0.65rem; }
    #launcher button {
      border: 0;
      border-radius: 5px;
      padding: 0.65rem 1rem;
      color: #fff;
      background: #004d40;
      font: 600 0.95rem/1.2 system-ui, sans-serif;
      cursor: pointer;
    }
    #launcher button:hover { background: #00695c; }
    #launcher button:disabled { cursor: wait; opacity: 0.7; }
    #launcher-status { min-height: 1.25rem; margin: 0.5rem 0 0; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="launcher">
    <div>
      <strong id="launcher-title">Interaktív Coq-példa</strong>
      <button id="start-example" type="button">Interaktív ablak indítása</button>
      <p id="launcher-status">A motor csak kattintás után töltődik be.</p>
    </div>
  </div>

  <div id="ide-wrapper" class="toggled" hidden>
    <div id="code-wrapper">
      <div id="document">
        <h1 id="example-heading">Boole és Ite</h1>
        <p>
          A jobb felső lefelé mutató nyíllal lépésenként futtathatod a kódot.
          A példát szabadon módosíthatod.
        </p>
        <textarea id="coq-code">(* A példa betöltése… *)</textarea>
      </div>
    </div>
  </div>

  <script type="module">
    const examples = {
      syntax: {
        title: 'A Boole-kifejezések szintaxisa',
        file: 'syntax.v',
      },
      operations: {
        title: 'Származtatott műveletek',
        file: 'operations.v',
      },
      denotation: {
        title: 'Denotációs szemantika',
        file: 'denotation.v',
      },
      reduction: {
        title: 'Kiértékelés beta_reduce-dzal',
        file: 'reduction.v',
      },
      comparison: {
        title: 'Szintaxis, eredmény és denotáció',
        file: 'comparison.v',
      },
      normalization: {
        title: 'A gyenge normalizáció bizonyítása',
        file: 'normalization.v',
      },
      denote_beta: {
        title: 'A beta-redukció megőrzi a denotációt',
        file: 'denote_beta.v',
      },
      practice_beta_2: {
        title: '1/A – Béta-redukció: Tru / Fal / Fal',
        directory: 'eloadas_02',
        file: 'practice_beta_2.v',
        exercise: true,
      },
      practice_beta_4: {
        title: '1/B – Béta-redukció: Fal / Fal / Tru',
        directory: 'eloadas_02',
        file: 'practice_beta_4.v',
        exercise: true,
      },
      practice_connective_3: {
        title: '2/A – Kizáró vagy',
        directory: 'eloadas_02',
        file: 'practice_connective_3.v',
        exercise: true,
      },
      practice_connective_4: {
        title: '2/B – Ekvivalencia',
        directory: 'eloadas_02',
        file: 'practice_connective_4.v',
        exercise: true,
      },
      practice_denotation_3: {
        title: '3/A – Asszociativitás',
        directory: 'eloadas_02',
        file: 'practice_denotation_3.v',
        exercise: true,
      },
      practice_denotation_4: {
        title: '3/B – De Morgan-azonosság',
        directory: 'eloadas_02',
        file: 'practice_denotation_4.v',
        exercise: true,
      },
      practice_syntax_2: {
        title: '4/A – Beágyazott állandó igaz',
        directory: 'eloadas_02',
        file: 'practice_syntax_2.v',
        exercise: true,
      },
      practice_syntax_4: {
        title: '4/B – Beágyazott konjunkció',
        directory: 'eloadas_02',
        file: 'practice_syntax_4.v',
        exercise: true,
      },
      prg_passports: {
        title: 'Programok mint tanúsítványok',
        directory: 'eloadas_02',
        file: 'prg_passports.v',
      },
      prg_rules: {
        title: 'A prg nyolc konstruktora',
        directory: 'eloadas_02',
        file: 'prg_rules.v',
      },
      weakening: {
        title: 'Gyengítés: weakening',
        directory: 'eloadas_02',
        file: 'weakening.v',
      },
      contradiction: {
        title: 'Ellentmondás: contradictionI',
        directory: 'eloadas_02',
        file: 'contradiction.v',
      },
      and_intro: {
        title: 'Konjunkció bevezetése: andI',
        directory: 'eloadas_02',
        file: 'and_intro.v',
      },
    };

    const requested = new URLSearchParams(window.location.search).get('example');
    const selected = examples[requested]
      ? [examples[requested]]
      : [examples.syntax];

    const launcher = document.getElementById('launcher');
    const startButton = document.getElementById('start-example');
    const status = document.getElementById('launcher-status');
    const ide = document.getElementById('ide-wrapper');
    const title = selected.length === 1 ? selected[0].title : 'Az első előadás példái';
    document.getElementById('launcher-title').textContent = title;
    document.getElementById('example-heading').textContent = title;

    async function loadStylesheet(href) {
      await new Promise((resolve, reject) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        link.addEventListener('load', resolve, { once: true });
        link.addEventListener('error', reject, { once: true });
        document.head.appendChild(link);
      });
    }

    async function startExample() {
      startButton.disabled = true;
      status.textContent = 'A példa és az ellenőrzőmotor betöltése…';

      try {
        const sources = await Promise.all(selected.map(async example => {
          const directory = example.directory ?? 'eloadas_01';
          const response = await fetch(`./examples/${directory}/${example.file}`);
          if (!response.ok) throw new Error(`Nem sikerült betölteni: ${example.file}`);
          const source = await response.text();
          if (!example.exercise) return source;

          const starter = source.replace(
            /\nAbort\.\s*$/,
            '\n  (* Ide írd a bizonyítást, majd zárd Qed.-del. *)\n',
          );
          if (starter === source) {
            throw new Error(`A feladatból hiányzik a záró Abort.: ${example.file}`);
          }
          return starter;
        }));

        document.getElementById('coq-code').value = sources.join('\n\n');
        await loadStylesheet('../vendor/jscoq/dist/frontend/index.css');
        const { JsCoq } = await import('../vendor/jscoq/jscoq.js');

        document.body.classList.add('jscoq-main');
        window.matlogCoq = await JsCoq.start(['coq-code'], {
          prelude: true,
          implicit_libs: true,
          focus: false,
          editor: { mode: { 'company-coq': true }, keyMap: 'default' },
          init_pkgs: ['init'],
          all_pkgs: ['coq'],
        });
        await window.matlogCoq.when_ready.promise;

        launcher.hidden = true;
        ide.hidden = false;
        for (const snippet of window.matlogCoq.provider.snippets) {
          snippet.editor.refresh();
        }
        window.parent.postMessage({
          type: 'matlog-rocq-resize',
          height: 680,
        }, window.location.origin);
      } catch (error) {
        startButton.disabled = false;
        status.textContent = `Hiba: ${error.message}`;
      }
    }

    startButton.addEventListener('click', startExample);
  </script>
</body>
</html>
